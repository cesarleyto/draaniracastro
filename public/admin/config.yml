backend:
  name: git-gateway
  branch: main

media_folder: "src/assets/images"
public_folder: "../../assets/images"

collections:
  - name: "blog"
    label: "Artículos"
    folder: "src/content/blog"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - {label: "Título", name: "title", widget: "string"}
      - {label: "Fecha", name: "pubDate", widget: "datetime"}
      - {label: "Categoría", name: "category", widget: "select", options: ["Síntomas", "Diagnósticos", "Testimonios", "Vida Académica"]}
      - {label: "Resumen corto", name: "excerpt", widget: "text"}
      - {label: "Imagen de Portada", name: "image", widget: "image", required: false}
      - {label: "Cuerpo del artículo", name: "body", widget: "markdown"}
